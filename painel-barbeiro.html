<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="#111111" name="theme-color"/>
<title>Painel do barbeiro | BARBEARIA CASTRO</title>
<style>
:root{--bg:#101010;--panel:#191919;--panel2:#222;--gold:#d6ad65;--gold2:#f0cf91;--muted:#9b9b9b;--white:#f5f2ec;--line:#303030;--green:#75c69a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#292319 0%,var(--bg) 52%);color:var(--white);font-family:Inter,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.top{padding:23px max(22px,calc((100% - 1100px)/2));border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#141414}.brand{display:flex;align-items:center;gap:12px}.brand-logo{width:58px;height:58px;object-fit:contain;display:block;border-radius:10px;filter:drop-shadow(0 2px 8px #d6ad6540)}.brand strong{letter-spacing:2px;font-size:15px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:3px;margin-top:4px}.status{font-size:11px;color:var(--green);letter-spacing:1px}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px}
main{max-width:1100px;margin:auto;padding:42px 22px 70px}.hero{text-align:center;margin:5px 0 34px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:4px;text-transform:uppercase}.hero h1{font-family:Georgia,serif;font-size:clamp(34px,6vw,54px);font-weight:400;margin:12px 0}.hero p{color:var(--muted);margin:0;font-size:14px}.layout{display:grid;grid-template-columns:1fr 330px;gap:22px;align-items:start}.card{background:linear-gradient(145deg,#1c1c1c,#171717);border:1px solid #35312a;border-radius:16px;padding:25px;margin-bottom:17px;box-shadow:0 14px 35px #0003}
.step{display:flex;align-items:center;gap:12px;margin-bottom:20px}.num{width:27px;height:27px;border:1px solid var(--gold);color:var(--gold);border-radius:50%;display:grid;place-items:center;font-size:12px}.step h2{font-size:16px;margin:0;font-weight:600}.step small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.services{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.service{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:15px;text-align:left;color:var(--white);transition:.22s}.service:hover,.service.active{border-color:var(--gold);background:#29251e;transform:translateY(-2px)}.service.active{box-shadow:0 0 0 1px #d6ad6533,0 8px 20px #0003}.service .symbol{font-size:21px;margin-bottom:10px}.service strong{display:block;font-size:13px}.service span{display:block;color:var(--muted);font-size:11px;margin-top:5px}.service em{display:block;color:var(--gold);font-style:normal;font-weight:700;margin-top:12px;font-size:13px}
.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:14px}.field label{display:block;font-size:11px;color:#c7c2b9;margin-bottom:8px;letter-spacing:.7px}.field input,.field select,.fixed-barber{width:100%;background:#111;border:1px solid #393939;color:var(--white);padding:13px;border-radius:8px;outline:none}.field input:focus,.field select:focus{border-color:var(--gold)}
/* Calendário premium */
.calendar-shell{background:linear-gradient(160deg,#201e1a,#151515);border:1px solid #393329;border-radius:14px;padding:18px;margin:4px 0 22px;box-shadow:inset 0 1px #ffffff08}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:19px}.month-title{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}.month-title strong{font-family:Georgia,serif;font-size:clamp(20px,3vw,27px);font-weight:400;text-transform:capitalize;color:var(--gold2)}.month-title small{font-size:9px;letter-spacing:2.4px;color:var(--muted);text-transform:uppercase}.month-nav{width:39px;height:39px;flex:0 0 39px;border:1px solid #55472f;background:#28231b;color:var(--gold2);border-radius:11px;font-size:25px;line-height:1;display:grid;place-items:center;transition:.2s}.month-nav:hover:not(:disabled){background:#3a3020;border-color:var(--gold);transform:translateY(-2px)}.month-nav:disabled{opacity:.25;cursor:not-allowed}
.calendar-week,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.calendar-week{margin-bottom:8px}.calendar-week span{text-align:center;color:#a99b82;font-size:9px;font-weight:700;letter-spacing:1px;padding:5px 0}.calendar-empty{aspect-ratio:1}.calendar-day{position:relative;aspect-ratio:1;min-width:0;border:1px solid transparent;background:#242321;color:#eee9df;border-radius:10px;font-size:13px;font-weight:600;display:grid;place-items:center;transition:.18s;animation:dayIn .28s both}.calendar-day:hover:not(:disabled){border-color:var(--gold);background:#332b1e;transform:scale(1.06)}.calendar-day.today{border-color:#9c7940;color:var(--gold2)}.calendar-day.today:after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--gold)}.calendar-day.active{background:linear-gradient(145deg,#f0cf91,#c69a50);border-color:#f4d9a7;color:#1b160e;box-shadow:0 5px 15px #d6ad6540;transform:scale(1.04)}.calendar-day:disabled{background:#171717;border:1px dashed #383330;color:#625c56;opacity:.55;cursor:not-allowed;text-decoration:line-through}.calendar-day:disabled:after{display:none}.calendar-legend{display:flex;flex-wrap:wrap;gap:15px;margin:14px 2px 0;color:var(--muted);font-size:10px}.legend-item{display:inline-flex;align-items:center;gap:6px}.legend-dot{width:8px;height:8px;border-radius:3px;border:1px solid var(--gold)}.legend-dot.selected{background:var(--gold)}.legend-dot.unavailable{background:#242321;border:1px dashed #625c56}
.times{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.time{background:linear-gradient(145deg,#292929,#202020);border:1px solid #3a3936;color:var(--white);border-radius:9px;padding:12px 4px;font-size:12px;font-weight:600;transition:.18s}.time:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px);background:#30291e}.time.active{background:linear-gradient(145deg,#f0cf91,#c69a50);color:#17130c;border-color:#f0cf91;font-weight:800;box-shadow:0 5px 14px #d6ad6533}.time:disabled{opacity:.28;cursor:not-allowed;text-decoration:line-through}@keyframes dayIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}.calendar-grid,.times{animation:fadeUp .22s ease}@keyframes fadeUp{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.summary{position:sticky;top:18px}.summary h3{font-family:Georgia,serif;font-size:24px;font-weight:400;margin:0 0 20px}.summaryline{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.summaryline span:first-child{color:var(--muted)}.total{font-size:17px;color:var(--gold);font-weight:700}.note{color:var(--muted);font-size:11px;line-height:1.6;margin:17px 0}.primary{width:100%;border:0;border-radius:8px;background:linear-gradient(135deg,#edcb8b,#c79b55);color:#17130c;padding:15px;font-weight:800;letter-spacing:.5px;transition:.2s}.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}.primary:disabled{opacity:.4;cursor:not-allowed}.confirm{display:none;text-align:center;padding:26px 15px}.check{width:58px;height:58px;border:1px solid var(--green);color:var(--green);border-radius:50%;display:grid;place-items:center;font-size:28px;margin:0 auto 16px}.confirm h2{font-family:Georgia,serif;font-size:29px;font-weight:400}.confirm p{color:var(--muted);font-size:13px;line-height:1.7}.secondary{margin-top:10px;background:transparent;border:1px solid var(--line);color:var(--white);padding:12px 17px;border-radius:7px}footer{text-align:center;color:#777;font-size:10px;letter-spacing:2px;padding:20px;border-top:1px solid var(--line)}.toast{color:#ffb0a6;font-size:11px;margin-top:10px;min-height:15px}
@media(max-width:760px){main{padding:28px 14px 45px}.layout{grid-template-columns:1fr}.summary{position:static;grid-row:1}.card{padding:19px}.services{grid-template-columns:1fr 1fr}.calendar-shell{padding:13px}.calendar-week,.calendar-grid{gap:5px}.calendar-day{border-radius:8px;font-size:12px}.times{grid-template-columns:repeat(4,minmax(0,1fr))}.top{padding:16px 17px}}@media(max-width:420px){.calendar-shell{padding:10px}.calendar-week,.calendar-grid{gap:4px}.calendar-day{border-radius:7px;font-size:11px}.calendar-week span{font-size:8px}.times{grid-template-columns:repeat(3,minmax(0,1fr))}.month-nav{width:35px;height:35px;flex-basis:35px}.calendar-legend{gap:9px;font-size:9px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Painel interno de agendamentos */
.appointments-card{margin-top:24px}.appointments-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.appointments-head h2{font-family:Georgia,serif;font-size:25px;font-weight:400;margin:0}.appointments-count{background:#302719;border:1px solid #695331;color:var(--gold2);padding:7px 11px;border-radius:20px;font-size:11px}.appointment-list{display:grid;gap:10px}.appointment-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px;background:#20201e;border:1px solid #39352e;border-radius:11px}.appointment-item strong{display:block;font-size:13px}.appointment-item small{display:block;color:var(--muted);font-size:11px;margin-top:5px;line-height:1.5}.appointment-item .appt-time{color:var(--gold2);font-weight:800;font-size:14px;white-space:nowrap}.appointment-cancel{margin-top:8px;border:1px solid #67413b;background:#2b1c1a;color:#e9a69b;border-radius:7px;padding:7px 10px;font-size:10px}.empty-appointments{padding:22px;text-align:center;border:1px dashed #494238;border-radius:10px;color:var(--muted);font-size:12px;line-height:1.6}.time.booked,.time:disabled.booked{background:#171717;border:1px dashed #514b43;color:#777;opacity:.48;text-decoration:line-through;cursor:not-allowed;box-shadow:none}.time.booked::after{content:' • reservado';font-size:9px;display:block;margin-top:3px;text-decoration:none}.panel-caption{color:var(--muted);font-size:11px;line-height:1.6;margin:-5px 0 15px}
@media(max-width:520px){.appointment-item{grid-template-columns:1fr auto;padding:12px}.appointment-item .appt-time{font-size:12px}}


/* Lembrete temporário no canto da tela */
.booking-reminder{position:fixed;right:22px;bottom:22px;z-index:99999;width:min(370px,calc(100vw - 28px));padding:17px 18px 16px 16px;background:linear-gradient(145deg,#252018,#151515);border:1px solid #b88b48;border-radius:14px;box-shadow:0 16px 45px #000a,0 0 22px #d6ad6522;display:flex;gap:12px;align-items:flex-start;opacity:0;transform:translateY(18px) scale(.98);pointer-events:none}
.booking-reminder.show{animation:reminderIn .35s cubic-bezier(.2,.8,.2,1) forwards;pointer-events:auto}
.booking-reminder.hide{animation:reminderOut .35s ease forwards}
.reminder-icon{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:#3a2d1b;border:1px solid #745a32;font-size:18px}
.reminder-copy{font-size:12px;line-height:1.55;color:#e8e1d5}.reminder-copy strong{display:block;color:var(--gold2);font-size:13px;margin-bottom:4px;letter-spacing:.2px}
.reminder-close{margin-left:auto;flex:0 0 auto;background:transparent;border:0;color:#bdb4a5;font-size:20px;line-height:1;padding:0 0 4px 6px}.reminder-close:hover{color:#fff}
@keyframes reminderIn{to{opacity:1;transform:translateY(0) scale(1)}}@keyframes reminderOut{to{opacity:0;transform:translateY(12px) scale(.98)}}
@media(max-width:520px){.brand-logo{width:49px;height:49px}.booking-reminder{right:14px;bottom:14px;width:calc(100vw - 28px)}}
@media(prefers-reduced-motion:reduce){.booking-reminder.show,.booking-reminder.hide{animation:none;opacity:1;transform:none}.booking-reminder.hide{opacity:0}}

</style>
<meta content="noindex,nofollow" name="robots"/><meta content="width=device-width,initial-scale=1" name="viewport"/></head>
<body><main style="max-width:1050px;margin:40px auto;padding:18px;min-height:80vh"><header style="margin-bottom:30px"><div class="eyebrow">BARBEARIA CASTRO • LONDRINA</div><h1>Painel do barbeiro</h1><p style="opacity:.75">Área restrita para consultar e gerenciar reservas.</p></header><section class="card appointments-card" id="appointmentsPanel">
<div class="appointments-head"><div><div class="eyebrow">PAINEL INTERNO</div><h2>Agendamentos</h2></div><span class="appointments-count" id="appointmentsCount">0 reservas</span></div>
<p class="panel-caption">Área exclusiva do administrador. Entre com sua conta para consultar e cancelar agendamentos.</p>
<div aria-live="polite" class="appointment-list" id="appointmentList"></div>
</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const $=s=>document.querySelector(s);
const db=window.supabase.createClient('https://jwnfqyysoppfbmvdqohm.supabase.co','sb_publishable_Yna-razOqRdgEQ-fmKRhEA_xck-Q2JM');
let session=null;
const login=document.createElement('div');
login.innerHTML='<div style="display:grid;gap:10px;max-width:430px;margin:20px 0"><label>E-mail do barbeiro<input id="adminEmail" type="email" autocomplete="username" placeholder="Seu e-mail" style="width:100%;padding:13px"></label><label>Senha<input id="adminPassword" type="password" autocomplete="current-password" style="width:100%;padding:13px"></label><button id="adminEnter" class="primary" type="button">Entrar</button><p id="adminError" role="alert"></p></div>';
const panel=$('#appointmentsPanel');panel.insertBefore(login,$('#appointmentList'));
const logout=document.createElement('button');logout.className='secondary';logout.textContent='Sair';logout.style.cssText='display:none;margin:12px 0';panel.insertBefore(logout,$('#appointmentList'));
async function verifyAdmin(user){
 if(!user){showAdmin(false);return;}
 const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();
 showAdmin(!error&&!!data);
}
function showAdmin(ok){session=ok;login.style.display=ok?'none':'block';logout.style.display=ok?'block':'none';$('#appointmentList').style.display=ok?'block':'none';$('#appointmentsCount').textContent=ok?'Carregando...':'Acesso restrito';if(ok)loadAppointments();}
async function loadAppointments(){
 if(!session)return;
 const {data,error}=await db.from('appointments').select('*').order('appointment_date',{ascending:false}).order('appointment_time');
 const root=$('#appointmentList');root.replaceChildren();
 if(error){root.textContent='Erro ao carregar: '+error.message;return;}
 const items=data||[];
 $('#appointmentsCount').textContent=items.filter(a=>a.status==='confirmed').length+' confirmadas';
 if(!items.length){root.textContent='Nenhum agendamento ainda.';return;}
 for(const a of items){
  const el=document.createElement('article');el.className='appointment-item';
  const info=document.createElement('div');
  const title=document.createElement('strong');title.textContent=a.customer_name;
  const details=document.createElement('small');details.textContent=`${a.appointment_date.split('-').reverse().join('/')} • ${a.service_name} • ${a.customer_phone} • ${a.status}`;
  info.append(title,details);
  if(a.status==='confirmed'){
   const btn=document.createElement('button');btn.className='appointment-cancel';btn.textContent='Cancelar reserva';
   btn.onclick=async()=>{if(!confirm('Deseja cancelar a reserva de '+a.customer_name+'?'))return;btn.disabled=true;const {error}=await db.from('appointments').update({status:'cancelled'}).eq('id',a.id);if(error){alert(error.message);btn.disabled=false}else await loadAppointments()};
   info.append(btn);
  }
  const time=document.createElement('div');time.className='appt-time';time.textContent=a.appointment_time.slice(0,5);
  el.append(info,time);root.append(el);
 }
}
$('#adminEnter').onclick=async()=>{
 $('#adminError').textContent='Entrando...';
 const {data,error}=await db.auth.signInWithPassword({email:$('#adminEmail').value.trim(),password:$('#adminPassword').value});
 if(error){$('#adminError').textContent='E-mail ou senha incorretos.';return;}
 await verifyAdmin(data.user);
 if(!session){await db.auth.signOut();$('#adminError').textContent='Esta conta não está autorizada como administrador.';}
};
logout.onclick=async()=>{await db.auth.signOut();showAdmin(false)};
db.auth.getUser().then(({data})=>verifyAdmin(data.user)).catch(()=>showAdmin(false));
setInterval(()=>{if(session)loadAppointments()},30000);
</script></body></html>
